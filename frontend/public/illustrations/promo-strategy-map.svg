<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 176" role="img" aria-labelledby="title desc">
  <title id="title">Promotion strategy map</title>
  <desc id="desc">A compact business analysis illustration with uplift quadrants, DID signal and action path.</desc>
  <defs>
