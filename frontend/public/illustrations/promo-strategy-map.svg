      <stop offset="0" stop-color="#fff8d7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#d6a500" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="420" height="176" rx="18" fill="url(#bg)"/>
  <path d="M25 131c44-24 79-14 113-47 30-29 60-44 104-27 44 17 75 5 111-25" fill="none" stroke="#ffcf22" stroke-width="12" stroke-linecap="round" opacity=".38"/>
